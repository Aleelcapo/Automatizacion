<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Archivo Black'; src: url('ArchivoBlack-Regular.ttf'); }
@font-face { font-family: 'IBM Plex Mono'; src: url('IBMPlexMono-Bold.ttf'); font-weight: bold; }
html, body { margin: 0; background: #000; width: 1080px; height: 1920px; overflow: hidden; }
canvas { display: block; }
.cap { position: absolute; top: 150px; left: 0; width: 1080px; text-align: center; font: 84px 'Archivo Black', sans-serif;
  color: #1d1a20; line-height: 1.05; letter-spacing: -1px; text-shadow: 0 0 0 #fff; -webkit-text-stroke: 0; }
.cap div { display: inline-block; background: rgba(255,255,255,0); padding: 0 12px; }
.cap div + div { display: block; }
.cap .red { color: #d6372b; }
.cap { paint-order: stroke fill; -webkit-text-stroke: 14px #fff8ec; }
</style></head>
<body>
<span style="font-family:'Archivo Black';position:absolute;opacity:0">.</span><span style="font-family:'IBM Plex Mono';font-weight:bold;position:absolute;opacity:0">.</span>
<script src="bundle.js"></script>
</body></html>
