<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { chica } from '/chica.js'; import { birome } from '/lapiz.js';
const C = document.getElementById('c'), X = C.getContext('2d');
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, clamp = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, t) => a + (b - a) * t;
function bg(t, hue = 0) {
  let s = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb4ff"/><stop offset=".6" stop-color="#cfe6ff"/><stop offset="1" stop-color="#ffe9f2"/></linearGradient><filter id="bl"><feGaussianBlur stdDeviation="10"/></filter><radialGradient id="bk"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`;
  s += `<rect width="1080" height="1920" fill="url(#sky)"/><g filter="url(#bl)"><rect x="80" y="160" width="920" height="900" fill="#e9f3ff" stroke="#c9d6ea" stroke-width="30"/><path d="M80 610 H1000 M540 160 V1060" stroke="#c9d6ea" stroke-width="22"/>`;
  s += [[240, 380, 90], [800, 300, 120], [600, 520, 70], [300, 760, 60]].map(([x, y, r]) => `<ellipse cx="${x + Math.sin(t * .3) * 20}" cy="${y}" rx="${r * 1.6}" ry="${r}" fill="#fff"/>`).join('');
  s += `<rect y="1200" width="1080" height="720" fill="#d9c2a8"/></g>`;
  s += Array.from({ length: 14 }, (_, i) => { const x = (i * 197 + t * 14 * (1 + i % 3)) % 1180 - 50, y = 200 + (i * 331) % 1400; return `<circle cx="${x}" cy="${y}" r="${18 + (i % 4) * 12}" fill="url(#bk)" opacity="${.25 + (i % 3) * .15}"/>`; }).join('');
  return s;
}
function speedLines(t, a) { let s = ''; for (let i = 0; i < 60; i++) { const ang = i / 60 * 6.283 + (i % 2) * .02, r0 = 520 + ((i * 97 + t * 900) % 260); s += `<path d="M${540 + Math.cos(ang) * r0} ${960 + Math.sin(ang) * r0} L${540 + Math.cos(ang) * 1400} ${960 + Math.sin(ang) * 1400}" stroke="#2a2440" stroke-width="${4 + (i % 3) * 3}" opacity="${a * .55}"/>`; } return s; }
// escenas
function frame(t) {
  let body = '', cam = { x: 540, y: 960, z: 1 }, sl = 0;
  if (t < 3) { // habla mirando a cámara
    const e = { mouth: (t > .3 && t < 2.7) ? Math.abs(Math.sin(t * 12)) * .7 : 0, mood: 'smile', look: [0, 0], blush: .3 };
    if ((t % 2.4) > 2.28) e.open = 0.05;
    cam = { x: 540, y: 900, z: lerp(1.0, 1.08, ease(t / 3)) };
    body = bg(t) + `<g transform="translate(540 820)">${chica(e, t)}</g>`;
  } else if (t < 4.4) { // inserto: la tapa con brillo
    const k = (t - 3) / 1.4;
    body = `<rect width="1080" height="1920" fill="#fff4dc"/>` + `<circle cx="540" cy="960" r="${500 + 80 * Math.sin(t * 2)}" fill="#ffe7a8"/>` + `<g transform="translate(${lerp(760, 820, k)} 960) rotate(-12) scale(1.15)">${birome(t, clamp((k - .3) * 2, 0, 1))}</g>`;
    cam = { x: 540, y: 960, z: lerp(1.0, 1.3, ease(k)) };
  } else if (t < 6.4) { // sorpresa con líneas de velocidad
    const k = (t - 4.4) / 2;
    const e = { mouth: .55, mood: 'o', wide: 1.18, small: 1, browUp: 18, browAng: -8, sweat: 1, look: [0, -.2] };
    sl = clamp(1 - k * 1.2, .3, 1);
    cam = { x: 540, y: 860, z: lerp(1.35, 1.25, ease(k)) + Math.exp(-k * 10) * .12 };
    body = bg(t) + speedLines(t, sl) + `<g transform="translate(${540 + Math.sin(t * 60) * 6 * Math.exp(-k * 6)} 820)">${chica(e, t)}</g>`;
  } else { // sonrisa y guiño
    const k = (t - 6.4) / 1.6;
    const e = { mouth: k < .6 ? Math.abs(Math.sin(t * 12)) * .6 : 0, mood: 'smile', blush: 1, look: [.2, 0], hairKick: Math.exp(-k * 4) };
    if (k > .7) e.open = .05;
    cam = { x: 540, y: 900, z: lerp(1.15, 1.05, ease(k)) };
    body = bg(t) + `<g transform="translate(540 820) rotate(${Math.sin(k * 3) * 2} 0 600)">${chica(e, t)}</g>` + (k > .7 ? `<text x="${780}" y="${430}" font-size="110" fill="#ffd34d" stroke="#2a2440" stroke-width="6" paint-order="stroke">✦</text>` : '');
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><g transform="translate(540 960) scale(${cam.z}) translate(${-cam.x} ${-cam.y})">${body}</g></svg>`;
}
window.renderFrame = async (i) => {
  const t = i / 30, svg = frame(t), img = new Image(), url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  await new Promise((r, j) => { img.onload = r; img.onerror = j; img.src = url; });
  X.clearRect(0, 0, 1080, 1920); X.drawImage(img, 0, 0); URL.revokeObjectURL(url);
  const v = X.createRadialGradient(540, 900, 500, 540, 960, 1150); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(40,20,60,.35)'); X.fillStyle = v; X.fillRect(0, 0, 1080, 1920);
  return C.toDataURL('image/jpeg', .92);
};
window.ready = true;
</script></body></html>
