<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Montserrat'; font-weight: 800; src: url('/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2'); }
html,body{margin:0;background:#000}</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script type="module">
const F = new URLSearchParams(location.search).get('f') || '1';
const L = '#3a3340';                       // contorno marrón-gris suave
const st = (w = 7) => `stroke="${L}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" filter="url(#wob)"`;
const defs = `<defs>
 <filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
 <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 .22 0"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
 <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="none"/><path d="M0 0 V16" stroke="${L}" stroke-width="3" opacity=".18"/></pattern>
</defs>`;
const paper = `<rect width="1080" height="1920" filter="url(#paper)"/>`;
let o = defs;
if (F === '1') {
  // escritorio con lápices y una birome, cámara cenital
  o += `<rect width="1080" height="1920" fill="#f3e3c4"/>`;
  o += `<rect x="-20" y="1180" width="1120" height="760" fill="#d9b48a" ${st()}/><rect x="-20" y="1180" width="1120" height="760" fill="url(#hatch)"/>`;
  o += `<rect x="90" y="250" width="420" height="560" rx="10" fill="#fdfbf4" ${st()} transform="rotate(-6 300 530)"/>` + [0,1,2,3,4,5,6].map(i=>`<path d="M${130} ${330+i*60} h${300-(i%3)*60}" stroke="#a9c8e8" stroke-width="6" stroke-linecap="round" transform="rotate(-6 300 530)"/>`).join('');
  o += `<g transform="translate(640 380) rotate(18)"><rect x="-40" y="-40" width="300" height="300" rx="34" fill="#9fd3c7" ${st()}/><circle cx="110" cy="110" r="70" fill="#f6efe0" ${st(6)}/><path d="M110 60 v50 l34 20" stroke="${L}" stroke-width="8" fill="none" stroke-linecap="round"/></g>`;
  // birome grande
  o += `<g transform="translate(540 1010) rotate(-22)"><ellipse cx="0" cy="40" rx="430" ry="30" fill="#000" opacity=".12" filter="url(#soft)"/>
    <path d="M-420 -26 L300 -26 L380 0 L300 26 L-420 26 Z" fill="#fdfdf8" ${st()}/><path d="M300 -26 L380 0 L300 26 Z" fill="#e7d9b8" ${st(6)}/><path d="M372 -4 L410 0 L372 4 Z" fill="${L}"/>
    <rect x="-180" y="-12" width="430" height="24" fill="#bfe0f6" opacity=".6"/><rect x="-170" y="-6" width="400" height="12" fill="#3b6ec6"/>
    <g transform="translate(-60 0)"><path d="M-400 -38 L-120 -38 Q-96 -38 -96 -14 L-96 14 Q-96 38 -120 38 L-400 38 Q-424 38 -424 14 L-424 -14 Q-424 -38 -400 -38 Z" fill="#3b6ec6" ${st()}/>
      <path d="M-160 -38 L-150 -100 L-120 -100 L-120 -38" fill="#3b6ec6" ${st(6)}/><circle cx="-380" cy="0" r="13" fill="#f3e3c4" ${st(5)}/></g></g>`;
  // flecha y círculo de atención
  o += `<circle cx="196" cy="1150" r="70" fill="none" stroke="#e8505b" stroke-width="10" stroke-dasharray="14 10" filter="url(#wob)"/><path d="M160 1420 Q120 1300 175 1235" fill="none" stroke="#e8505b" stroke-width="12" stroke-linecap="round" filter="url(#wob)"/><path d="M150 1250 L178 1222 L198 1262" fill="none" stroke="#e8505b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`;
} else if (F === '2') {
  // corte lateral de la garganta: la tapa atascada y el aire que pasa por el agujero
  o += `<rect width="1080" height="1920" fill="#fbe9df"/>`;
  o += `<path d="M120 1920 L120 1100 Q120 700 360 560 Q520 470 600 300 Q660 170 820 160 Q1000 160 1040 360 Q1060 520 960 640 L960 1920 Z" fill="#f6c9b0" ${st()}/>`;
  o += `<path d="M460 1920 L470 1180 Q480 1000 560 900 Q620 820 700 800 L760 790 Q820 790 820 860 L800 1180 L790 1920 Z" fill="#e98d8d" ${st()}/>`;
  o += `<path d="M640 1920 L645 1250 Q650 1150 700 1100" fill="none" stroke="#c96a6a" stroke-width="10" stroke-linecap="round"/>`;
  // tapa atascada
  o += `<g transform="translate(628 1280) rotate(8)"><rect x="-70" y="-140" width="140" height="280" rx="34" fill="#3b6ec6" ${st()}/><rect x="-22" y="-140" width="44" height="40" rx="10" fill="#fbe9df" ${st(5)}/><rect x="-9" y="-150" width="18" height="300" fill="#fbe9df" opacity=".85"/></g>`;
  // aire
  o += [0,1,2].map(i=>`<path d="M628 ${1720-i*40} Q${600+i*10} 1560 628 1440 L628 1120 Q${640-i*8} 980 ${700+i*12} 880" fill="none" stroke="#5aa9e6" stroke-width="${10-i*2}" stroke-dasharray="26 18" stroke-linecap="round" opacity="${1-i*.25}"/>`).join('');
  o += `<path d="M690 900 L716 860 L736 906" fill="none" stroke="#5aa9e6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`;
  o += `<g transform="translate(270 640)"><rect x="-150" y="-60" width="300" height="120" rx="60" fill="#fdfbf4" ${st(6)}/><text y="18" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="52" fill="#3b6ec6">AIRE</text></g>`;
  o += `<path d="M380 700 Q520 760 600 860" fill="none" stroke="${L}" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/>`;
}
o += paper;
document.getElementById('s').innerHTML = o; await document.fonts.ready; window.ready = true;
</script></body></html>
