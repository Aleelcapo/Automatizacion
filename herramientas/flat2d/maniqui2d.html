<!doctype html><html><head><meta charset="utf-8"><style>

  const X = k => side < 0 ? (VX - 150) * k : 1080 - (1080 - VX - 150) * k, T = k => (VY - 230) * k, B = k => 1920 + (VY + 190 - 1920) * k, D = k => B(k) - (B(k) - T(k)) * .6;

o += `<g opacity=".95"><rect x="40" y="1150" width="250" height="40" rx="10" fill="#f6f7f8"/><rect x="40" y="1140" width="250" height="18" rx="8" fill="#9fc8e0"/><rect x="60" y="1190" width="10" height="150" fill="#9aa6b0"/><rect x="260" y="1190" width="10" height="150" fill="#9aa6b0"/><circle cx="65" cy="1350" r="14" fill="#3a3f48"/><circle cx="265" cy="1350" r="14" fill="#3a3f48"/></g>`;

m += `<ellipse cx="361" cy="1256" rx="36" ry="42" fill="url(#wh)" stroke="#cbd4df" stroke-width="2"/>`;
