<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Anton'; src: url('/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 800; src: url('/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2'); }
html,body{margin:0;background:#000}</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script type="module">
import { drawCharacter, drawBack } from '/estilo.js';
import { DEFS, LIGHT, officeA, officeB, corridor } from '/fondos.js';
const F = new URLSearchParams(location.search).get('f') || '1';
const cap = (t, y = 1380) => `<text x="540" y="${y}" font-family="Anton" font-size="128" text-anchor="middle" fill="#fff" stroke="#000" stroke-width="16" paint-order="stroke" stroke-linejoin="round">${t}</text>`;
const shadow = (x, y, w) => `<ellipse cx="${x}" cy="${y}" rx="${w}" ry="${w * .12}" fill="#000" opacity=".25"/>`;
let out = DEFS;
if (F === '1') {
  out += officeA();
  out += `<g transform="translate(690 2560) scale(2.25)">${drawCharacter('house', { armR: [34, 122], handR: 'point', propL: 'cane', armL: [8, -6], head: { tilt: -4, dx: -4 }, face: { look: [-.8, -.1], mood: 'smirk', browL: -6, browR: 10, browUp: [6, 0], mouth: .25 } })}</g>`;
  out += LIGHT() + cap('síntomas');
} else if (F === '2') {
  out += officeB();
  out += shadow(440, 1890, 150) + `<g transform="translate(440 1890) scale(1.45)">${drawCharacter('house', { armR: [38, 62], handR: 'open', propL: 'cane', armL: [8, -6], head: { tilt: 3 }, face: { look: [.6, .1], mood: 'smirk', mouth: .55, browL: -8, browR: 8, browUp: [0, 8] } })}</g>`;
  out += `<g transform="translate(860 3350) scale(2.6)">${drawBack('leo', { tilt: -4 })}</g>`;
  out += LIGHT(1, .8) + cap('¿borracho?');
} else {
  out += corridor();
  out += `<g transform="translate(500 2600) scale(2.3)">${drawCharacter('ana', { propR: 'clipboard', armR: [10, -118], armL: [10, 52], handL: 'open', head: { tilt: 4 }, face: { look: [.5, 0], mouth: .5, browUp: [9, 9], browL: 6, browR: 6 } })}</g>`;
  out += LIGHT(.7, .9) + cap('¿y si miente?');
}
document.getElementById('s').innerHTML = out; await document.fonts.ready; window.ready = true;
</script></body></html>
